name: snapshelf
description: "SnapShelf — label screenshots, sort onto shelves, delete from Photos."
publish_to: "none"
version: 0.1.0+1

# Pinned for macOS Ventura + Flutter 3.24.5 (Dart 3.5.4).
# Newer Flutter on Windows still works with this lower bound.
environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  photo_manager: ^3.5.0
  uuid: ^4.4.2
  shared_preferences: ^2.3.2
  sqflite_common_ffi: ^2.3.3
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  crypto: ^3.0.5
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
